[project]
name = "bank-widget"
version = "0.1.0"
description = "Виджет для отображения банковских операций"
authors = [
    {name = "Твоё Имя", email = "tvoi@example.com"}
]

requires-python = "^3.12"
dependencies = [
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=1.20.1,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 119
exclude = '\.git|\.venv|venv|__pycache__'

[tool.isort]
profile = "black"
line_length = 119
skip = [".git", ".venv", "venv", "__pycache__"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv|__pycache__"